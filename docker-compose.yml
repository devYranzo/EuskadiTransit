services:
  # Base de datos PostGIS
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: euskadi_user
      POSTGRES_PASSWORD: euskadi_password
      POSTGRES_DB: euskadi_transit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Servidor de mapas vectorial
  tile-server:
    image: ghcr.io/maplibre/martin:latest
    ports:
      - "5000:3000"
    environment:
      - DATABASE_URL=postgresql://euskadi_user:euskadi_password@db:5432/euskadi_transit
    volumes:
      - ./Data:/Data
    command: ["--webui", "enable-for-all", "/Data"]
    restart: unless-stopped
    depends_on:
      - db

  # Backend FastAPI
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://euskadi_user:euskadi_password@db:5432/euskadi_transit
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      - db

volumes:
  pgdata:

  # Redis para caché de datos en tiempo real (GTFS-RT)
